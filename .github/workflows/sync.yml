name: Weekly sync

on:
  schedule:
    - cron: "0 18 * * 0"   # Sunday 18:00 UTC = Monday morning in Australia
  workflow_dispatch:

permissions:
  contents: write   # to update the data release

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
      ABN_LOOKUP_GUID: ${{ secrets.ABN_LOOKUP_GUID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

      # The database lives as an asset on a "data" release so each run builds on the last.
      - name: Restore database
        run: |
          mkdir -p data
          if gh release download data --pattern bizscraper.db.gz --dir data; then
            gunzip -f data/bizscraper.db.gz
          else
            echo "No previous database; starting fresh (first run backfills all history)."
          fi

      - name: Sync all sources
        run: bizscraper sync all

      - name: Classify new rows with Claude
        if: env.ANTHROPIC_API_KEY != ''
        timeout-minutes: 95        # backstop; the command stops itself at 80 minutes
        continue-on-error: true
        run: bizscraper classify --max-minutes 80

      - name: Merge categories into markets
        if: env.ANTHROPIC_API_KEY != ''
        timeout-minutes: 20
        continue-on-error: true
        run: bizscraper markets --map --top 0

      - name: Summary
        if: always()
        run: bizscraper stats | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Export and publish
        if: always()
        run: |
          bizscraper export --out data/candidates.csv
          bizscraper export --revenue-only --out data/candidates_with_revenue.csv
          bizscraper categories --top 1000 --out data/categories.csv
          bizscraper markets --top 1000 --min-items 2 --out data/markets.csv
          bizscraper snapshot data/snapshot.db
          gzip -c data/snapshot.db > data/bizscraper.db.gz
          gzip -kf data/candidates.csv
          gh release view data >/dev/null 2>&1 || gh release create data --title "Latest data" --notes "Updated by the weekly sync workflow."
          gh release upload data data/bizscraper.db.gz data/candidates.csv.gz data/candidates_with_revenue.csv data/categories.csv data/markets.csv --clobber
